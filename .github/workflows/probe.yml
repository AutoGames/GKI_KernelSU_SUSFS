name: Probe Branches

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Kernel version of each android15-6.6 quarterly branch
        run: |
          for br in 2026-01 2026-04 2026-07 2026-10 lts; do
            echo "=== common-android15-6.6-${br} ==="
            curl -sf "https://android.googlesource.com/kernel/common/+/refs/heads/common-android15-6.6-${br}/Makefile?format=TEXT" \
              | base64 -d 2>/dev/null | head -5 || echo "  fetch failed"
            echo ""
          done

      - name: Highest numeric tags for android15-6.6
        run: |
          git ls-remote --tags https://android.googlesource.com/kernel/common 2>/dev/null \
            | grep -oE 'android15-6\.6\.[0-9]+_r00$' \
            | sed 's/android15-6\.6\.//; s/_r00//' \
            | sort -n | uniq | tail -20
