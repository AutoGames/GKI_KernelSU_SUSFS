name: Probe Branches

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect kernel/Makefile config_data rule
        run: |
          echo "=== kernel/Makefile 中 config_data 相关 ==="
          curl -sf "https://android.googlesource.com/kernel/common/+/refs/heads/android15-6.6-2026-07/kernel/Makefile?format=TEXT" \
            | base64 -d > /tmp/kernel_mk 2>/dev/null || echo "fetch failed"
          wc -l /tmp/kernel_mk 2>/dev/null
          grep -n -A4 -B4 "config_data\|KCONFIG_CONFIG\|filechk" /tmp/kernel_mk 2>/dev/null | head -60

      - name: Check ikconfig Kconfig and configs.c
        run: |
          echo "=== kernel/configs.c 头部 ==="
          curl -sf "https://android.googlesource.com/kernel/common/+/refs/heads/android15-6.6-2026-07/kernel/configs.c?format=TEXT" \
            | base64 -d | head -40

      - name: Android side - who reads /proc/config.gz
        run: |
          echo "=== 搜索 AOSP 中读取 kernel config 的代码 ==="
          for f in system/core/libutils/ProcessCallStack.cpp; do :; done
          echo "(跳过，重点看内核侧)"
