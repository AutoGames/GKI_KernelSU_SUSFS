name: Probe Branches

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List android15-6.6 branches in kernel manifest
        run: |
          echo "=== manifest heads: android15-6.6 ==="
          git ls-remote --heads https://android.googlesource.com/kernel/manifest 2>&1 | grep -i "android15-6.6" | tail -50 || echo "none"
          echo ""
          echo "=== manifest heads: android16 ==="
          git ls-remote --heads https://android.googlesource.com/kernel/manifest 2>&1 | grep -i "android16" | tail -20 || echo "none"

      - name: List kernel common tags around 6.6.1xx
        run: |
          echo "=== common tags: android15-6.6.1xx ==="
          git ls-remote --tags https://android.googlesource.com/kernel/common 2>&1 | grep -E "android15-6\.6\.1[0-9][0-9]\b" | tail -40 || echo "none"
          echo ""
          echo "=== common tags: highest android15-6.6 ==="
          git ls-remote --tags https://android.googlesource.com/kernel/common 2>&1 | grep -E "android15-6\.6\." | tail -15 || echo "none"

      - name: Check GKI certified boot images available
        run: |
          for y in 2026-01 2026-02 2026-03 2026-04 2026-05 2026-06 2026-07 2026-08; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' "https://dl.google.com/android/gki/gki-certified-boot-android15-6.6-${y}_r1.zip")
            echo "${y} -> HTTP ${code}"
          done
